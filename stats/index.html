const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(raw){
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const box=b64(BOX);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:box.slice(0,12)},key,box.slice(12)));
  document.open();
  document.write('<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+html+'</body></html>');
  document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(SALT),iterations:ROUNDS},base,256));
}
(async()=>{let k=null;try{k=localStorage.getItem(KEEP)}catch(e){}
  if(k){try{await open_(b64(k));return}catch(e){try{localStorage.removeItem(KEEP)}catch(_){}}}})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();const msg=document.getElementById("msg");msg.textContent="Opening…";
  try{const raw=await derive(document.getElementById("pw").value);
    if(document.getElementById("keep").checked){try{localStorage.setItem(KEEP,btoa(String.fromCharCode(...raw)))}catch(e){}}
    await open_(raw)}catch(e){msg.textContent="That password didn't open it. Try again.";try{localStorage.removeItem(KEEP)}catch(_){}}
});
